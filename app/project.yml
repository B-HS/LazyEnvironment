name: LazyEnvironment
options:
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "0.0.1"
targets:
  LazyEnvironment:
    type: application
    platform: macOS
    sources:
      - path: LazyEnvironment/Sources
      - path: LazyEnvironment/Resources
    info:
      path: LazyEnvironment/Info.plist
      properties:
        CFBundleDisplayName: Lazy Environment
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleURLTypes:
          - CFBundleURLName: com.hyunseokbyun.LazyEnvironment
            CFBundleURLSchemes:
              - lazyenvironment
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyunseokbyun.LazyEnvironment
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LazyEnvironmentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/LazyEnvironmentTests
    dependencies:
      - target: LazyEnvironment
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LazyEnvironment:
    build:
      targets:
        LazyEnvironment: all
        LazyEnvironmentTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LazyEnvironmentTests
